import javax.inject.Inject

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Kunci rilis: keystore.properties atau env
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }
def signingValue = { String key, String env -> keystoreProps.getProperty(key) ?: System.getenv(env) }
def releaseStoreFile = signingValue('storeFile', 'XFLIX_KEYSTORE_FILE')

android {
    namespace 'com.xflix.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.xflix.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword signingValue('storePassword', 'XFLIX_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'XFLIX_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'XFLIX_KEY_PASSWORD')
            }
        }
    }
    buildFeatures {
        compose true
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            if (releaseStoreFile) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

base {
    archivesName = "xflix_" + android.defaultConfig.versionName
}

// Video ikut APK, bukan git
def mediaLibrary = file(providers.gradleProperty('xflix.mediaDir')
    .getOrElse(new File(System.getProperty('user.home'), 'Videos/Xflix').path))

abstract class BundleXflixMedia extends DefaultTask {
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getVideos()

    @Internal
    abstract DirectoryProperty getLibrary()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void bundle() {
        def source = library.get().asFile
        fs.sync { spec ->
            spec.into(outputDir.dir('media'))
            if (source.isDirectory()) spec.from(source) { it.include('*/*.mp4') }
        }
    }
}

def bundleMedia = tasks.register('bundleXflixMedia', BundleXflixMedia) {
    library.fileValue(mediaLibrary)
    videos.from(fileTree(mediaLibrary) { include '*/*.mp4' })
    outputDir.set(layout.buildDirectory.dir('generated/xflix-media'))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(bundleMedia) { it.outputDir }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.10.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.activity:activity-compose:1.11.0'

    def lifecycle_version = '2.9.4'
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycle_version"
    implementation 'androidx.navigation:navigation-compose:2.9.5'

    def media3_version = '1.8.0'
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"

    testImplementation 'junit:junit:4.13.2'
}
